<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kurvenreich">
<meta name="theme-color" content="#14171c">
<title>Kurvenreich</title>
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#14171c;--panel:#1d2128;--panel2:#272c35;--line:#333a46;--text:#eef1f5;--muted:#9aa3b2;--acc:#ff5a1f;--blue:#3fa7ff;--ok:#2ecc71;--danger:#ff4d5e;--sat:env(safe-area-inset-top);--sab:env(safe-area-inset-bottom)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:15px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow:hidden;overscroll-behavior:none}
#map{position:fixed;inset:0;background:#0e1013}
button,.btn{font:inherit;color:inherit;border:0;background:var(--panel2);border-radius:12px;padding:10px 14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
button:disabled{opacity:.4}
.primary{background:var(--acc)!important;color:#fff!important;font-weight:650}
.danger{background:var(--danger)!important;color:#fff!important;font-weight:650}
.ghost{background:none;color:var(--muted)}
.small{padding:8px 11px;font-size:14px}
.wide{width:100%;margin-top:10px;padding:13px}
.grow{flex:1}
.hidden{display:none!important}
.row{display:flex;gap:8px;align-items:center;margin:8px 0}
.hint,.note{color:var(--muted);font-size:13.5px;margin:6px 2px}
/* Suche */
#topbar{position:fixed;top:calc(var(--sat) + 10px);left:12px;right:12px;z-index:1001}
.search{display:flex;align-items:center;gap:8px;background:rgba(29,33,40,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:14px;padding:0 4px 0 12px;box-shadow:0 4px 18px rgba(0,0,0,.35)}
.search input{flex:1;min-width:0;background:none;border:0;color:var(--text);font-size:16px;padding:13px 0;outline:none}
.search button{background:none;color:var(--muted);padding:8px 10px}
#results{margin-top:6px;background:var(--panel);border-radius:14px;overflow:hidden;max-height:50vh;overflow-y:auto;box-shadow:0 6px 20px rgba(0,0,0,.4)}
#results:empty{display:none}
.res{padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.res:last-child{border-bottom:0}
.res small{display:block;color:var(--muted)}
/* FABs */
#fabs{position:fixed;right:12px;top:calc(var(--sat) + 70px);z-index:1000;display:flex;flex-direction:column;gap:10px}
.fab{width:46px;height:46px;border-radius:14px;padding:0;background:rgba(29,33,40,.96);box-shadow:0 4px 14px rgba(0,0,0,.35)}
.fab svg{width:22px;height:22px}
#layerMenu{position:fixed;right:66px;top:calc(var(--sat) + 70px);z-index:1001;background:var(--panel);border-radius:14px;padding:6px;display:flex;flex-direction:column;gap:4px;box-shadow:0 6px 20px rgba(0,0,0,.4)}
#layerMenu button{background:none;justify-content:flex-start}
#layerMenu button.on{background:var(--panel2);color:var(--acc)}
/* Sheet */
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:1000;background:var(--panel);border-radius:20px 20px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.45);max-height:64vh;display:flex;flex-direction:column;padding-bottom:var(--sab)}
#sheet.collapsed .panels{display:none}
.handle{padding:8px 0 4px;display:flex;justify-content:center;cursor:pointer}
.handle span{width:42px;height:5px;border-radius:3px;background:#4a5160}
.tabs{display:flex;gap:6px;padding:2px 12px 8px}
.tabs button{flex:1;background:none;color:var(--muted);font-weight:650;padding:9px 4px}
.tabs button.active{background:var(--panel2);color:var(--text)}
.panels{overflow-y:auto;padding:0 14px 14px;-webkit-overflow-scrolling:touch}
.field{margin:12px 0 4px}
.field>label{display:block;color:var(--muted);font-size:13px;margin-bottom:6px}
.seg{display:flex;background:var(--panel2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;background:none;padding:9px 4px;font-size:14px;color:var(--muted);border-radius:10px}
.seg button.on{background:var(--acc);color:#fff;font-weight:650}
.toggle{display:flex;align-items:center;gap:10px;margin:12px 2px 2px;color:var(--text)}
.toggle input{width:20px;height:20px;accent-color:var(--acc)}
input[type=range]{width:100%;accent-color:var(--acc)}
.pill{background:var(--panel2);border-radius:12px;padding:10px 12px;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wprow{display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:1px solid var(--line)}
.wplabel{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icon{background:none;color:var(--muted);padding:4px 8px}
.dot{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;flex:none}
.dot-start{background:var(--ok)}.dot-end{background:var(--acc)}.dot-via{background:#5865f2}
/* Ergebnis */
.result{background:var(--panel2);border-radius:16px;padding:12px;margin-top:12px}
.rstats{display:flex;justify-content:space-between;text-align:center}
.rstats div{flex:1}
.rstats b{display:block;font-size:19px}
.rstats small{color:var(--muted);font-size:12px}
.stars{color:var(--acc);letter-spacing:1px}
.chips{display:flex;gap:6px;overflow-x:auto;margin:10px 0 2px}
.chips{scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{background:var(--panel);font-size:13px;padding:7px 10px;white-space:nowrap;border:1.5px solid transparent}
.chip.on{border-color:var(--acc)}
.ractions{display:flex;gap:8px;margin-top:10px}
.ractions button{flex:1;background:var(--panel)}
/* Touren */
.tour{background:var(--panel2);border-radius:14px;padding:11px 12px;margin-top:8px}
.tour .t1{display:flex;justify-content:space-between;gap:8px;font-weight:600}
.tour .t2{color:var(--muted);font-size:13px;margin-top:2px}
.tour .ta{display:flex;gap:6px;margin-top:8px}
.tour .ta button{background:var(--panel);font-size:13px;padding:7px 10px}
.badge{font-size:11px;padding:2px 7px;border-radius:8px;background:var(--panel);color:var(--muted);font-weight:600;white-space:nowrap}
/* Marker */
.wp{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.5)}
.wp-start{background:var(--ok)}.wp-end{background:var(--acc)}.wp-via{background:#5865f2}
.me{width:40px;height:40px;display:grid;place-items:center}
.me .dot{width:18px;height:18px;background:var(--blue);border:3px solid #fff;box-shadow:0 0 0 7px rgba(63,167,255,.25)}
.me svg{width:38px;height:38px;display:none;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}
body.driving .me .dot{display:none}
body.driving .me svg{display:block}
/* Fahrmodus */
body.driving #sheet,body.driving #topbar,body.driving #btnLayers{display:none}
body.driving #fabs{top:calc(var(--sat) + 140px)}
#navCard{position:fixed;top:calc(var(--sat) + 10px);left:10px;right:10px;z-index:1002;background:#17834f;color:#fff;border-radius:18px;padding:12px 14px;display:flex;gap:14px;align-items:center;box-shadow:0 6px 20px rgba(0,0,0,.45)}
#navArrow{width:58px;height:58px;flex:none;display:grid;place-items:center}
#navArrow svg{width:56px;height:56px}
#navDist{font-size:30px;font-weight:750;line-height:1.1}
#navText{font-size:17px;opacity:.95}
#navBar{position:fixed;left:10px;right:10px;bottom:calc(var(--sab) + 10px);z-index:1002;background:var(--panel);border-radius:18px;padding:10px;display:flex;align-items:center;gap:10px;box-shadow:0 -4px 20px rgba(0,0,0,.45)}
.spd{width:66px;height:66px;border-radius:50%;border:3px solid var(--acc);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none}
.spd b{font-size:23px;line-height:1}.spd small{font-size:11px;color:var(--muted)}
.stat{flex:1;text-align:center}.stat b{display:block;font-size:18px}.stat small{color:var(--muted);font-size:12px}
#navSound{padding:10px 11px}
/* Overlays */
#busy{position:fixed;inset:0;z-index:2000;background:rgba(10,12,15,.55);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#fff;font-weight:600;text-align:center;padding:20px}
.spinner{width:42px;height:42px;border:4px solid rgba(255,255,255,.25);border-top-color:var(--acc);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;bottom:calc(var(--sab) + 30%);transform:translateX(-50%);z-index:2100;background:#000c;color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;max-width:88vw;text-align:center;opacity:0;pointer-events:none;transition:opacity .25s}
#toast.show{opacity:1}
#modal{position:fixed;inset:0;z-index:2200;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:20px}
.mbox{background:var(--panel);border-radius:18px;padding:18px;width:100%;max-width:380px}
.mbox h3{margin:0 0 6px;font-size:18px}
.mbox p{margin:0 0 10px;color:var(--muted)}
.mbox p:empty{display:none}
.mbox input{width:100%;font-size:16px;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--text);outline:none;margin:4px 0 12px}
.mbtns{display:flex;gap:8px}.mbtns button{flex:1}
/* Leaflet */
.leaflet-control-attribution{font-size:10px;background:rgba(20,23,28,.7)!important;color:#bbb!important;border-radius:6px 0 0 0}
.leaflet-control-attribution a{color:#ddd!important}
.leaflet-bottom.leaflet-right{bottom:calc(var(--sab) + 120px)}
body.driving .leaflet-bottom.leaflet-right{bottom:calc(var(--sab) + 96px)}
.leaflet-div-icon{background:none;border:0}
</style>
</head>
<body>
<div id="map"></div>

<div id="topbar">
  <div class="search">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9aa3b2" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
    <input id="q" type="search" placeholder="Ort oder Adresse suchen" autocomplete="off" enterkeyhint="search">
    <button id="qclear" class="hidden" aria-label="Leeren">✕</button>
  </div>
  <div id="results"></div>
</div>

<div id="fabs">
  <button id="btnLayers" class="fab" aria-label="Kartenstil"><svg viewBox="0 0 24 24" fill="none" stroke="#eef1f5" stroke-width="2" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></svg></button>
  <button id="btnLocate" class="fab" aria-label="Mein Standort"><svg viewBox="0 0 24 24" fill="none" stroke="#3fa7ff" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
</div>
<div id="layerMenu" class="hidden">
  <button data-layer="standard">Standard</button>
  <button data-layer="dunkel">Dunkel</button>
  <button data-layer="topo">Gelände</button>
</div>

<div id="sheet">
  <div class="handle" id="handle"><span></span></div>
  <div class="tabs">
    <button data-tab="plan" class="active">Route</button>
    <button data-tab="loop">Rundtour</button>
    <button data-tab="tours">Touren</button>
  </div>
  <div class="panels">
    <div class="panel" id="panel-plan">
      <div id="wpList"></div>
      <div class="row">
        <button id="btnHereStart" class="small">📍 Standort als Start</button>
        <button id="btnClear" class="small ghost">Alles löschen</button>
      </div>
      <div class="field"><label>Routenstil</label>
        <div class="seg" id="planMode"><button data-v="schnell">Schnell</button><button data-v="kurvig">Kurvig</button><button data-v="extra">Extra kurvig</button></div>
      </div>
      <label class="toggle"><input type="checkbox" class="avoidChk"> Autobahnen meiden</label>
      <button id="btnCalc" class="primary wide" disabled>Route berechnen</button>
      <div id="planResult"></div>
    </div>

    <div class="panel hidden" id="panel-loop">
      <div class="field"><label>Start</label>
        <div class="row" style="margin:0"><div id="loopStartLabel" class="pill grow">Tippe auf die Karte oder suche oben</div><button id="loopHere" class="small">📍 Standort</button></div>
      </div>
      <div class="field"><label>Länge: <b id="loopKmLbl" style="color:var(--text)">120 km</b></label>
        <input type="range" id="loopKm" min="30" max="400" step="10" value="120">
      </div>
      <div class="field"><label>Richtung</label>
        <div class="seg" id="loopDir"><button data-v="zufall" class="on">Zufall</button><button data-v="n">N</button><button data-v="o">O</button><button data-v="s">S</button><button data-v="w">W</button></div>
      </div>
      <div class="field"><label>Stil</label>
        <div class="seg" id="loopMode"><button data-v="kurvig" class="on">Kurvig</button><button data-v="extra">Extra kurvig</button></div>
      </div>
      <label class="toggle"><input type="checkbox" class="avoidChk"> Autobahnen meiden</label>
      <button id="btnLoop" class="primary wide">Rundtour erstellen</button>
      <div id="loopResult"></div>
    </div>

    <div class="panel hidden" id="panel-tours">
      <div class="row">
        <button id="btnRec" class="primary grow">● Tour aufzeichnen</button>
        <label class="btn small" for="gpxFile">GPX importieren</label>
        <input type="file" id="gpxFile" hidden>
      </div>
      <div id="tourList"></div>
      <p class="note">Touren werden nur auf diesem Gerät im Browser gespeichert. Wichtiges am besten als GPX sichern.</p>
    </div>
  </div>
</div>

<div id="nav" class="hidden">
  <div id="navCard"><div id="navArrow"></div><div style="min-width:0"><div id="navDist"></div><div id="navText"></div></div></div>
  <div id="navBar">
    <div class="spd"><b id="navSpeed">0</b><small>km/h</small></div>
    <div class="stat"><b id="navA">–</b><small id="navALbl">verbleibend</small></div>
    <div class="stat"><b id="navB">–</b><small id="navBLbl">Ankunft</small></div>
    <button id="navSound" aria-label="Ton">🔊</button>
    <button id="navStop" class="danger">Stopp</button>
  </div>
</div>

<div id="busy" class="hidden"><div class="spinner"></div><div id="busyText"></div></div>
<div id="toast"></div>
<div id="modal" class="hidden"><div class="mbox"><h3 id="mTitle"></h3><p id="mText"></p><input id="mInput"><div class="mbtns"><button id="mCancel"></button><button id="mOk" class="primary"></button></div></div></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
'use strict';
/* ---------- Helfer ---------- */
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { toast('Speicher voll – bitte alte Touren löschen'); return false; } }
};
const sleep = ms => new Promise(r => setTimeout(r, ms));
let toastT;
function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 3200); }
function busy(on, t = '') { $('#busy').classList.toggle('hidden', !on); $('#busyText').textContent = t; }
function fmtKm(m) { return m < 1000 ? Math.round(m / 10) * 10 + ' m' : (m / 1000).toFixed(m < 10000 ? 1 : 0).replace('.', ',') + ' km'; }
function fmtDur(s) { s = Math.max(0, Math.round(s)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); return h ? `${h}:${String(m).padStart(2, '0')} h` : `${m} min`; }
function fmtClock(d) { return d.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }); }
function fmtSpeakDist(d) { return d >= 1000 ? `${(d / 1000).toFixed(1).replace('.', ',')} Kilometern` : `${Math.max(50, Math.round(d / 50) * 50)} Metern`; }
const stars = n => '★'.repeat(n) + '☆'.repeat(5 - n);

function modal({ title, text = '', input = null, ok = 'OK', cancel = 'Abbrechen', danger = false }) {
  return new Promise(res => {
    $('#mTitle').textContent = title; $('#mText').textContent = text;
    const inp = $('#mInput'); inp.style.display = input === null ? 'none' : ''; inp.value = input || '';
    $('#mOk').textContent = ok; $('#mOk').className = danger ? 'danger' : 'primary'; $('#mCancel').textContent = cancel;
    $('#modal').classList.remove('hidden');
    if (input !== null) setTimeout(() => inp.select(), 60);
    const done = v => { $('#modal').classList.add('hidden'); $('#mOk').onclick = $('#mCancel').onclick = null; res(v); };
    $('#mOk').onclick = () => done(input === null ? true : (inp.value.trim() || input));
    $('#mCancel').onclick = () => done(input === null ? false : null);
  });
}

/* ---------- Geometrie ---------- */
const R = 6371000, toRad = d => d * Math.PI / 180, toDeg = r => r * 180 / Math.PI;
function dist(a, b) {
  const dLat = toRad(b[0] - a[0]), dLng = toRad(b[1] - a[1]);
  const s = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(a[0])) * Math.cos(toRad(b[0])) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.min(1, Math.sqrt(s)));
}
function bearing(a, b) {
  const y = Math.sin(toRad(b[1] - a[1])) * Math.cos(toRad(b[0]));
  const x = Math.cos(toRad(a[0])) * Math.sin(toRad(b[0])) - Math.sin(toRad(a[0])) * Math.cos(toRad(b[0])) * Math.cos(toRad(b[1] - a[1]));
  return (toDeg(Math.atan2(y, x)) + 360) % 360;
}
function destPoint(p, brg, d) {
  const δ = d / R, θ = toRad(brg), φ1 = toRad(p[0]), λ1 = toRad(p[1]);
  const φ2 = Math.asin(Math.sin(φ1) * Math.cos(δ) + Math.cos(φ1) * Math.sin(δ) * Math.cos(θ));
  const λ2 = λ1 + Math.atan2(Math.sin(θ) * Math.sin(δ) * Math.cos(φ1), Math.cos(δ) - Math.sin(φ1) * Math.sin(φ2));
  return [toDeg(φ2), ((toDeg(λ2) + 540) % 360) - 180];
}
function pathLen(c) { let d = 0; for (let i = 1; i < c.length; i++) d += dist(c[i - 1], c[i]); return d; }
function resample(c, step) {
  const out = [c[0]]; let acc = 0;
  for (let i = 1; i < c.length; i++) { acc += dist(c[i - 1], c[i]); if (acc >= step) { out.push(c[i]); acc = 0; } }
  if (out[out.length - 1] !== c[c.length - 1]) out.push(c[c.length - 1]);
  return out;
}
/* Kurvigkeit: Richtungsänderung pro km (Abzweige gedeckelt), Rückwege erkennen */
function analyze(coords) {
  const pts = resample(coords, 40); let turn = 0;
  for (let i = 1; i < pts.length - 1; i++) {
    let d = Math.abs(bearing(pts[i], pts[i + 1]) - bearing(pts[i - 1], pts[i])); if (d > 180) d = 360 - d;
    if (d > 4 && d < 150) turn += Math.min(d, 40);
  }
  const cells = new Map(); let back = 0;
  pts.forEach((p, i) => { const k = Math.round(p[0] * 2000) + ':' + Math.round(p[1] * 1300); const prev = cells.get(k); if (prev === undefined) cells.set(k, i); else if (i - prev > 15) back++; });
  const km = Math.max(pathLen(coords) / 1000, 0.1), dpk = turn / km;
  return { degPerKm: dpk, backtrack: back / pts.length, rating: dpk < 35 ? 1 : dpk < 70 ? 2 : dpk < 120 ? 3 : dpk < 190 ? 4 : 5 };
}
function project(coords, cum, pt, i0 = 0, i1 = coords.length - 1) {
  const k = Math.cos(toRad(pt[0])); let best = { d: Infinity, i: 0, along: 0 };
  for (let i = Math.max(0, i0); i < Math.min(i1, coords.length - 1); i++) {
    const a = coords[i], b = coords[i + 1];
    const ax = (a[1] - pt[1]) * k, ay = a[0] - pt[0], bx = (b[1] - pt[1]) * k, by = b[0] - pt[0];
    const dx = bx - ax, dy = by - ay, L2 = dx * dx + dy * dy;
    let t = L2 ? -(ax * dx + ay * dy) / L2 : 0; t = Math.max(0, Math.min(1, t));
    const x = ax + t * dx, y = ay + t * dy, d = Math.sqrt(x * x + y * y) * 111320;
    if (d < best.d) best = { d, i, along: cum[i] + t * (cum[i + 1] - cum[i]) };
  }
  if (coords.length === 1) best = { d: dist(coords[0], pt), i: 0, along: 0 };
  return best;
}

/* ---------- Zustand & Karte ---------- */
const S = { tab: 'plan', mode: store.get('kr_mode', 'kurvig'), avoid: store.get('kr_avoid', true), wps: [], route: null, cands: [], here: null,
  loopStart: null, loopKm: 120, loopDir: 'zufall', loopMode: 'kurvig', active: null };

/* ---------- Routing (OSRM, OpenStreetMap) ---------- */
async function osrm(points, { alternatives = false, exclude = true } = {}, attempt = 0) {

  let url = `https://router.project-osrm.org/route/v1/driving/${c}?overview=full&geometries=geojson&steps=true${alternatives ? '&alternatives=3' : ''}`;
  if (exclude) url += '&exclude=motorway';

  if (r.status === 429 && attempt < 3) { await sleep(1500 * (attempt + 1)); return osrm(points, { alternatives, exclude }, attempt + 1); }
  let j = null; try { j = await r.json(); } catch (e) { }
  if (!r.ok || !j || j.code !== 'Ok') {
    if (exclude) return osrm(points, { alternatives, exclude: false }, attempt);
    throw new Error((j && (j.message || j.code)) || 'Routing fehlgeschlagen');
  }
  return j.routes.map(rt => ({ coords: rt.geometry.coordinates.map(c => [c[1], c[0]]), distance: rt.distance, duration: rt.duration, steps: rt.legs.flatMap(l => l.steps), pts: points }));
}
function makeDetours(wps, mode) {

  return sets.map(fs => {
    const out = [wps[0]];
    for (let i = 1; i < wps.length; i++) {
      const a = wps[i - 1], b = wps[i], d = dist(a, b), brg = bearing(a, b);
      if (d > 4000) fs.forEach((f, k) => { const base = destPoint(a, brg, d * (k + 1) / (fs.length + 1)); out.push(destPoint(base, brg + (f > 0 ? 90 : -90), d * Math.abs(f))); });
      out.push(b);
    }
    return out;

}

  cands.forEach(c => { c.stats = c.stats || analyze(c.coords); if (!uniq.some(u => Math.abs(u.distance - c.distance) / c.distance < 0.015 && Math.abs(u.stats.degPerKm - c.stats.degPerKm) < 3)) uniq.push(c); });

async function planLoop() {
  let st = S.loopStart;
  if (!st && S.here) { setLoopStart(S.here[0], S.here[1], 'Mein Standort'); st = S.loopStart; }
  if (!st) { toast('Bitte Start wählen: Standort, Suche oder auf die Karte tippen'); return; }
  const target = S.loopKm, start = [st.lat, st.lng], dirs = { n: 0, o: 90, s: 180, w: 270 };
  let r = target * 1000 / (2 * Math.PI) * 0.72; const tries = 5, cands = [];

    for (let t = 0; t < tries; t++) {
      busy(true, `Plane Rundtour… Variante ${t + 1}/${tries}`);
      const brg = S.loopDir === 'zufall' ? Math.random() * 360 : dirs[S.loopDir] + (Math.random() - 0.5) * 50;
      const center = destPoint(start, brg, r), back = (brg + 180) % 360, n = S.loopMode === 'extra' ? 4 : 3, sign = Math.random() < .5 ? 1 : -1, pts = [start];
      for (let k = 1; k <= n; k++) pts.push(destPoint(center, back + sign * k * 360 / (n + 1), r * (0.85 + Math.random() * 0.3)));

}

/* ---------- Navigationsansagen ---------- */
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const DIRS = { left: 'links abbiegen', right: 'rechts abbiegen', 'slight left': 'leicht links halten', 'slight right': 'leicht rechts halten', 'sharp left': 'scharf links abbiegen', 'sharp right': 'scharf rechts abbiegen', straight: 'geradeaus weiterfahren', uturn: 'wenden' };
function isManeuver(s) {
  const t = s.maneuver.type, m = s.maneuver.modifier;
  if (['depart', 'arrive', 'notification'].includes(t)) return false;
  if ((t === 'new name' || t === 'continue') && (!m || m === 'straight')) return false;
  return true;
}
function instr(s) {
  const m = s.maneuver, mod = m.modifier || '', name = s.ref || s.name || ''; let t;
  switch (m.type) {
    case 'roundabout': case 'rotary': t = m.exit ? `Im Kreisverkehr die ${m.exit}. Ausfahrt nehmen` : 'In den Kreisverkehr fahren'; break;
    case 'exit roundabout': case 'exit rotary': t = 'Kreisverkehr verlassen'; break;
    case 'merge': t = 'Einfädeln'; break;
    case 'on ramp': t = 'Auffahrt nehmen'; break;
    case 'off ramp': t = 'Ausfahrt nehmen'; break;
    case 'fork': t = mod.includes('left') ? 'An der Gabelung links halten' : mod.includes('right') ? 'An der Gabelung rechts halten' : 'An der Gabelung geradeaus'; break;
    case 'end of road': t = mod.includes('left') ? 'Am Straßenende links abbiegen' : 'Am Straßenende rechts abbiegen'; break;
    default: t = cap(DIRS[mod] || 'weiterfahren');
  }
  if (name && !['exit roundabout', 'exit rotary', 'roundabout', 'rotary'].includes(m.type)) t += ` auf ${name}`;
  return t;
}
function arrowSvg(st) {
  if (!st) return '<svg viewBox="0 0 24 24"><path d="M12 3l6 7h-4v11h-4V10H6z" fill="#fff"/></svg>';
  if (st.type === 'roundabout' || st.type === 'rotary') return `<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4"><circle cx="12" cy="13" r="5"/><path d="M12 8V2M9 5l3-3 3 3" stroke-linecap="round"/><text x="12" y="16" text-anchor="middle" fill="#fff" stroke="none" font-size="7" font-weight="700">${st.exit || ''}</text></svg>`;
  const rot = { straight: 0, 'slight right': 40, right: 90, 'sharp right': 135, uturn: 180, 'sharp left': -135, left: -90, 'slight left': -40 }[st.mod] || 0;
  return `<svg viewBox="0 0 24 24" style="transform:rotate(${rot}deg)"><path d="M12 2l7 8h-4.5v12h-5V10H5z" fill="#fff"/></svg>`;
}

/* ---------- Fahren: Navigation + Aufzeichnung ---------- */
class Recorder {
  constructor() { this.pts = []; this.t0 = Date.now(); this.dist = 0; this.max = 0; this.line = L.polyline([], { color: '#3fa7ff', weight: 4, opacity: .9, interactive: false }).addTo(map); }
  add(p) {
    const c = p.coords; if (c.accuracy > 50) return;
    const pt = [c.latitude, c.longitude], last = this.pts[this.pts.length - 1];
    if (last) { const d = dist(last, pt); if (d < 8) return; this.dist += d; }
    this.pts.push([+pt[0].toFixed(6), +pt[1].toFixed(6), Math.round((p.timestamp || Date.now()) / 1000)]); this.line.addLatLng(pt);
    const sp = (c.speed ?? 0) * 3.6; if (sp > this.max && sp < 320) this.max = sp;
  }
}
function prepNav(ses, r) {
  ses.route = r; const cum = [0]; for (let i = 1; i < r.coords.length; i++) cum.push(cum[i - 1] + dist(r.coords[i - 1], r.coords[i]));
  ses.cum = cum; ses.total = cum[cum.length - 1]; ses.idx = 0; ses.along = 0; ses.announced = {}; ses.arrived = false;
  let from = 0; ses.steps = [];
  (r.steps || []).forEach((s, k) => {
    const loc = [s.maneuver.location[1], s.maneuver.location[0]], pr = project(r.coords, cum, loc, from); from = pr.i;
    if (isManeuver(s)) ses.steps.push({ id: k, along: pr.along, text: instr(s), mod: s.maneuver.modifier, type: s.maneuver.type, exit: s.maneuver.exit });
  });
  const pts = r.pts || [r.coords[0], r.coords[r.coords.length - 1]]; let f = 0;
  ses.pts = pts; ses.ptAlong = pts.map((p, i) => { if (i === pts.length - 1) return ses.total; const pr = project(r.coords, cum, p, f); f = pr.i; return pr.along; });
}
function startSession(withNav) {
  if (S.active) return;
  if (withNav && !S.route) return;
  startWatch(); requestWake();
  const ses = { nav: withNav, rec: new Recorder(), off: 0, follow: true, speed: 0, rerouting: false, lastReroute: 0 };
  if (withNav) prepNav(ses, S.route);
  ses.onPos = p => sessionPos(ses, p);
  S.active = ses; document.body.classList.add('driving'); $('#nav').classList.remove('hidden');
  $('#navCard').classList.toggle('hidden', !withNav);
  $('#navSound').textContent = soundOn ? '🔊' : '🔇';
  $('#navALbl').textContent = withNav ? 'verbleibend' : 'gefahren';
  $('#navBLbl').textContent = withNav ? 'Ankunft' : 'Zeit';
  if (withNav) { $('#navDist').textContent = '…'; $('#navText').textContent = 'Warte auf GPS-Signal'; $('#navArrow').innerHTML = arrowSvg(null); }
  speak(withNav ? 'Los geht\'s. Gute Fahrt!' : 'Aufzeichnung gestartet');
  if (S.here) map.setView(S.here, 16);
  ses.timer = setInterval(() => updateHud(ses), 1000); updateHud(ses);
}
map.on('dragstart', () => { if (S.active) S.active.follow = false; });
function sessionPos(ses, p) {
  ses.rec.add(p); const c = p.coords, pt = [c.latitude, c.longitude];
  if (c.speed != null && c.speed >= 0) ses.speed = c.speed * 3.6;
  let h = c.heading; if ((h == null || isNaN(h)) && ses.lastPt && dist(ses.lastPt, pt) > 6) h = bearing(ses.lastPt, pt);
  if (h != null && !isNaN(h)) ses.heading = h; ses.lastPt = pt; setMeHeading(ses.heading);
  if (ses.follow) map.setView(pt, Math.max(map.getZoom(), 15), { animate: true });
  if (ses.nav && !ses.arrived) navUpdate(ses, pt, c.accuracy);
  updateHud(ses);
}
function navUpdate(ses, pt, acc) {
  const r = ses.route; let pr = project(r.coords, ses.cum, pt, ses.idx - 30, ses.idx + 500);
  if (pr.d > 60) { const full = project(r.coords, ses.cum, pt); if (full.d < pr.d - 10) pr = full; }
  if (pr.d < Math.max(45, (acc || 0) + 15)) { ses.off = 0; ses.idx = pr.i; ses.along = Math.max(pr.along, ses.along - 50); }
  else { ses.off++; if (ses.off >= 3 && !ses.rerouting && Date.now() - ses.lastReroute > 20000) reroute(ses, pt); }
  ses.remain = ses.total - ses.along;
  if (ses.remain < 40 && ses.off === 0) { ses.arrived = true; speak('Sie haben Ihr Ziel erreicht'); $('#navArrow').innerHTML = '<div style="font-size:40px">🏁</div>'; $('#navDist').textContent = 'Ziel erreicht'; $('#navText').textContent = 'Aufzeichnung läuft weiter – tippe auf Stopp'; return; }
  const next = ses.steps.find(s => s.along > ses.along + 8); ses.next = next;
  if (next) {
    const d = next.along - ses.along, a = ses.announced[next.id] || (ses.announced[next.id] = {}), low = next.text.charAt(0).toLowerCase() + next.text.slice(1);
    if (d < 1000 && d > 600 && !a.far && ses.speed > 70) { a.far = 1; speak(`In ${fmtSpeakDist(d)} ${low}`); }
    else if (d < 350 && d > 110 && !a.mid) { a.mid = 1; speak(`In ${fmtSpeakDist(d)} ${low}`); }
    else if (d <= 60 && !a.now) { a.now = a.mid = 1; speak(next.text); }
  }
}
async function reroute(ses, pt) {
  ses.rerouting = true; ses.lastReroute = Date.now(); $('#navText').textContent = 'Route wird neu berechnet…';
  try {
    const rest = ses.pts.filter((p, i) => i > 0 && ses.ptAlong[i] > ses.along + 100);
    if (!rest.length) rest.push(ses.pts[ses.pts.length - 1]);
    const [rt] = await osrm([pt, ...rest], { exclude: S.avoid });
    rt.src = ses.route.src; rt.stats = analyze(rt.coords); S.route = rt; drawRoute(rt); prepNav(ses, rt); ses.off = 0;
    speak('Route neu berechnet');
  } catch (e) { toast('Neuberechnung fehlgeschlagen – folge der Linie'); }
  finally { ses.rerouting = false; }
}
function updateHud(ses) {
  $('#navSpeed').textContent = Math.round(ses.speed || 0);
  if (ses.nav) {
    const remain = ses.remain ?? ses.total;
    $('#navA').textContent = fmtKm(remain);
    $('#navB').textContent = fmtClock(new Date(Date.now() + ses.route.duration * (remain / Math.max(ses.total, 1)) * 1000));
    if (!ses.arrived && !ses.rerouting && ses.lastPt) {
      if (ses.off >= 2) { $('#navArrow').innerHTML = arrowSvg(null); $('#navDist').textContent = 'Abseits der Route'; $('#navText').textContent = 'Zurück zur orangen Linie'; }
      else if (ses.next) { $('#navArrow').innerHTML = arrowSvg(ses.next); $('#navDist').textContent = fmtKm(ses.next.along - ses.along); $('#navText').textContent = ses.next.text; }
      else { $('#navArrow').innerHTML = arrowSvg(null); $('#navDist').textContent = fmtKm(remain); $('#navText').textContent = ses.steps.length ? 'Bis zum Ziel' : 'Folge der Route'; }
    }
  } else {
    $('#navA').textContent = fmtKm(ses.rec.dist);
    $('#navB').textContent = fmtDur((Date.now() - ses.rec.t0) / 1000);
  }
}
$('#navStop').onclick = async () => {
  const ses = S.active; if (!ses) return;
  if (!await modal({ title: 'Fahrt beenden?', ok: 'Beenden', danger: true })) return;
  clearInterval(ses.timer); S.active = null; releaseWake(); document.body.classList.remove('driving'); $('#nav').classList.add('hidden');
  setMeHeading(0); const rec = ses.rec; map.removeLayer(rec.line);
  if (rec.pts.length > 5 && rec.dist > 300) {
    const sec = (Date.now() - rec.t0) / 1000;
    const name = await modal({ title: 'Tour speichern?', text: `${fmtKm(rec.dist)} in ${fmtDur(sec)} · max. ${Math.round(rec.max)} km/h`, input: 'Tour vom ' + new Date().toLocaleDateString('de-DE'), ok: 'Speichern', cancel: 'Verwerfen' });
    if (name) saveTour({ id: Date.now(), name, type: 'gefahren', date: new Date().toISOString(), km: rec.dist / 1000, sec, max: rec.max, coords: rec.pts });
  } else toast('Fahrt beendet (zu kurz zum Speichern)');
  if (S.route) fitRoute(S.route);
};
$('#btnRec').onclick = () => startSession(false);

/* ---------- Touren speichern ---------- */
function thin(coords, minD = 12) { const out = [coords[0]]; for (let i = 1; i < coords.length - 1; i++) if (dist(out[out.length - 1], coords[i]) >= minD) out.push(coords[i]); out.push(coords[coords.length - 1]); return out.map(c => [+c[0].toFixed(5), +c[1].toFixed(5)]); }
function saveTour(t) { const tours = store.get('kr_tours', []); tours.unshift(t); if (store.set('kr_tours', tours)) { toast('Gespeichert ✓'); renderTours(); } }
async function savePlanned() {
  const r = S.route; if (!r) return;
  const name = await modal({ title: 'Route speichern', input: r.name || `${r.src === 'loop' ? 'Rundtour' : 'Route'} ${fmtKm(r.distance)}`, ok: 'Speichern' });
  if (!name) return;
  r.name = name; renderResult();
  saveTour({ id: Date.now(), name, type: 'geplant', date: new Date().toISOString(), km: r.distance / 1000, sec: r.duration, coords: thin(r.coords),
    pts: r.pts ? r.pts.map(p => [+p[0].toFixed(5), +p[1].toFixed(5)]) : null,
    steps: (r.steps || []).map(s => ({ maneuver: { type: s.maneuver.type, modifier: s.maneuver.modifier, exit: s.maneuver.exit, location: s.maneuver.location }, name: s.name, ref: s.ref })) });
}
function renderTours() {
  const tours = store.get('kr_tours', []), el = $('#tourList');
  if (!tours.length) { el.innerHTML = '<p class="hint">Noch keine Touren. Plane eine Route und tippe „Speichern“ oder zeichne eine Fahrt auf.</p>'; return; }
  el.innerHTML = tours.map(t => `<div class="tour"><div class="t1"><span>${esc(t.name)}</span><span class="badge">${t.type === 'gefahren' ? 'Gefahren' : 'Geplant'}</span></div>
    <div class="t2">${new Date(t.date).toLocaleDateString('de-DE')} · ${fmtKm(t.km * 1000)} · ${fmtDur(t.sec)}${t.max ? ' · max. ' + Math.round(t.max) + ' km/h' : ''}</div>
    <div class="ta"><button data-show="${t.id}">Anzeigen</button><button data-gpx="${t.id}">GPX</button><button data-ren="${t.id}">Umbenennen</button><button data-del="${t.id}">Löschen</button></div></div>`).join('');
  const find = id => store.get('kr_tours', []).find(t => t.id === +id);
  el.querySelectorAll('[data-show]').forEach(b => b.onclick = () => {
    const t = find(b.dataset.show); if (!t) return;
    const coords = t.coords.map(c => [c[0], c[1]]);
    S.cands = []; switchTab('plan');
    setRoute({ coords, distance: t.km * 1000, duration: t.sec, steps: t.steps || [], pts: t.pts || null, src: 'saved', name: t.name }, true);
  });
  el.querySelectorAll('[data-gpx]').forEach(b => b.onclick = () => { const t = find(b.dataset.gpx); t && shareGpx(t.name, t.coords); });
  el.querySelectorAll('[data-ren]').forEach(b => b.onclick = async () => {
    const tours = store.get('kr_tours', []), t = tours.find(x => x.id === +b.dataset.ren); if (!t) return;
    const n = await modal({ title: 'Umbenennen', input: t.name, ok: 'Speichern' }); if (!n) return;
    t.name = n; store.set('kr_tours', tours); renderTours();
  });
  el.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
    const t = find(b.dataset.del); if (!t || !await modal({ title: 'Tour löschen?', text: t.name, ok: 'Löschen', danger: true })) return;
    store.set('kr_tours', store.get('kr_tours', []).filter(x => x.id !== t.id)); renderTours();
  });
}

/* ---------- GPX ---------- */
async function shareGpx(name, coords) {
  const pts = coords.map(c => `<trkpt lat="${c[0]}" lon="${c[1]}">${c[2] ? `<time>${new Date(c[2] * 1000).toISOString()}</time>` : ''}</trkpt>`).join('\n');
  const gpx = `<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="Kurvenreich" xmlns="http://www.topografix.com/GPX/1/1">\n<metadata><name>${esc(name)}</name></metadata>\n<trk><name>${esc(name)}</name><trkseg>\n${pts}\n</trkseg></trk>\n</gpx>`;
  const fname = (name.replace(/[^\wäöüÄÖÜß\- ]+/g, '').trim().replace(/\s+/g, '_') || 'tour') + '.gpx';
  const file = new File([gpx], fname, { type: 'application/gpx+xml' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) { try { await navigator.share({ files: [file], title: name }); return; } catch (e) { if (e.name === 'AbortError') return; } }
  const url = URL.createObjectURL(file), a = document.createElement('a'); a.href = url; a.download = fname; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 8000);
}
$('#gpxFile').onchange = async e => {
  const f = e.target.files[0]; if (!f) return; e.target.value = '';
  try {
    const doc = new DOMParser().parseFromString(await f.text(), 'application/xml');
    let nodes = [...doc.getElementsByTagName('trkpt')]; if (!nodes.length) nodes = [...doc.getElementsByTagName('rtept')]; if (!nodes.length) nodes = [...doc.getElementsByTagName('wpt')];
    const coords = nodes.map(n => [parseFloat(n.getAttribute('lat')), parseFloat(n.getAttribute('lon'))]).filter(c => !isNaN(c[0]) && !isNaN(c[1]));
    if (coords.length < 2) { toast('Keine Strecke in der GPX-Datei gefunden'); return; }
    const d = pathLen(coords), nm = doc.getElementsByTagName('name')[0];
    S.cands = []; switchTab('plan');
    setRoute({ coords, distance: d, duration: d / 1000 / 60 * 3600, steps: [], pts: null, src: 'gpx', name: (nm && nm.textContent.trim()) || f.name.replace(/\.gpx$/i, '') }, true);
    toast('GPX geladen – du kannst sie speichern oder losfahren');
  } catch (err) { toast('Datei konnte nicht gelesen werden'); }
};

/* ---------- Start ---------- */
renderWps();
if (window.speechSynthesis) speechSynthesis.getVoices();
if (location.protocol === 'file:') toast('Tipp: Für GPS muss die App über https geöffnet werden');
</script>
